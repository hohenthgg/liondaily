<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14120F">
<title>Lions Daily</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='25' x='4' font-size='24'>%E2%98%89</text></svg>">
<style>
/* ============================================================
   LIONS DAILY · sistema visual
   Manuscrito antigo, terminal, museu. A profundidade é linguagem:
   plano 0 = contexto · plano 1 = conteúdo · plano 2 = ativo agora.
   Sombras existem em duas intensidades e só isso.
   ============================================================ */
:root{
  --tinta:#14120F; --tinta-1:#1B1814; --tinta-2:#232019; --tinta-3:#2C271F;
  --linha:#332B23; --linha-forte:#4A3E32;
  --creme:#E9DFCD; --creme-2:#B3A794; --creme-3:#79705F;
  /* cor semântica — cada uma diz uma coisa e só ela */
  --laranja:#D96A2B;        /* ativo agora, o que pede atenção */
  --laranja-fraco:#8C4A22;
  --vermelho:#A8382E;       /* tensão, maléfico, cautela */
  --verde:#5A7D57;          /* favorável, benéfico, confirmado */
  --barro:#93694C;          /* estrutura, contexto, histórico */
  --azul-ceu:#5B7186;       /* neutro frio: dados brutos, cálculo */
  --sombra-1:0 1px 2px rgba(0,0,0,.38);
  --sombra-2:0 4px 14px rgba(0,0,0,.32);
  --r:10px; --r-s:6px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --larg:min(100%,58rem);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--tinta);color:var(--creme);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
::selection{background:var(--laranja-fraco);color:#fff}
a{color:var(--laranja);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.25;letter-spacing:.01em}
.gl{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols2",var(--serif);font-variant-emoji:text}
.mono{font-family:var(--mono);font-size:.85em;letter-spacing:-.01em}

/* ---------- cabeçalho e navegação (item 20) ---------- */
header.topo{position:sticky;top:0;z-index:40;background:rgba(20,18,15,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo-in{width:var(--larg);margin:0 auto;padding:.55rem .9rem;
  display:flex;align-items:center;gap:.7rem}
.marca{font-family:var(--serif);font-size:1.02rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--creme);white-space:nowrap}
.marca i{color:var(--laranja);font-style:normal}
.modos{display:flex;gap:2px;background:var(--tinta-2);border:1px solid var(--linha);
  border-radius:var(--r-s);padding:2px;margin-left:auto}
.modos button{padding:.3rem .8rem;border-radius:4px;font-size:.76rem;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--creme-3)}
.modos button[aria-selected=true]{background:var(--tinta-3);color:var(--laranja)}
.icone{width:2rem;height:2rem;display:grid;place-items:center;border-radius:var(--r-s);
  color:var(--creme-2);font-size:1.05rem;border:1px solid transparent}
.icone:hover,.icone:focus-visible{border-color:var(--linha-forte);color:var(--creme)}
nav.subnav{border-bottom:1px solid var(--linha);background:var(--tinta-1)}
.subnav-in{width:var(--larg);margin:0 auto;display:flex;gap:.15rem;overflow-x:auto;
  scrollbar-width:none;padding:0 .5rem}
.subnav-in::-webkit-scrollbar{display:none}
.subnav button{padding:.55rem .7rem;font-size:.72rem;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--creme-3);border-bottom:2px solid transparent;white-space:nowrap}
.subnav button[aria-selected=true]{color:var(--creme);border-bottom-color:var(--laranja)}

main{width:var(--larg);margin:0 auto;padding:1rem .9rem 5rem}
section[hidden]{display:none}
.tela>h2{font-size:1.35rem;margin-bottom:.15rem}
.tela>.sub{color:var(--creme-3);font-size:.85rem;margin-bottom:1.1rem}

/* ---------- bloco: a unidade de leitura, com 3 níveis (item 24) ---------- */
.bloco{background:var(--tinta-1);border:1px solid var(--linha);border-radius:var(--r);
  padding:.85rem .9rem;padding-right:2.5rem;margin-bottom:.6rem;box-shadow:var(--sombra-1);position:relative}
.bloco.ativo{background:var(--tinta-2);border-color:var(--laranja-fraco);box-shadow:var(--sombra-2)}
.bloco.plano{background:none;border-color:var(--linha);box-shadow:none}
.bloco-h{display:flex;align-items:flex-start;gap:.55rem;margin-bottom:.4rem}
.bloco-h .gl{font-size:1.25rem;line-height:1.2;color:var(--barro);flex:none;width:1.5rem;text-align:center}
.bloco-h h3{font-size:1rem;flex:1;min-width:0}
.bloco-h .pos{display:block;font-family:var(--mono);font-size:.74rem;color:var(--creme-3);
  font-weight:400;letter-spacing:0;margin-top:.12rem}
.bloco-h h3 .selo{margin-top:.32rem}
.conclusao{font-size:.95rem}
.conclusao b{color:var(--creme);font-weight:600}

/* selos de certeza (item 25) */
.selo{display:inline-flex;align-items:center;gap:.28rem;font-family:var(--mono);
  font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;padding:.12rem .38rem;
  border-radius:3px;border:1px solid;white-space:nowrap;vertical-align:middle}
.selo::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.selo.tradicional{color:var(--verde);border-color:#3B5239}
.selo.derivado{color:var(--barro);border-color:#5C4331}
.selo.heuristico{color:var(--azul-ceu);border-color:#3C4A57}
.selo.experimental{color:var(--vermelho);border-color:#5E2721}

/* camadas: por quê / cálculo */
details.camada{margin-top:.5rem;border-top:1px dashed var(--linha);padding-top:.45rem}
details.camada>summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:.68rem;
  letter-spacing:.11em;text-transform:uppercase;color:var(--creme-3);display:flex;
  align-items:center;gap:.35rem;padding:.1rem 0}
details.camada>summary::-webkit-details-marker{display:none}
details.camada>summary::before{content:"+";color:var(--laranja);font-family:var(--mono);width:.8em}
details.camada[open]>summary::before{content:"–"}
details.camada>summary:hover{color:var(--creme-2)}
details.camada .corpo{padding:.5rem 0 .1rem;font-size:.88rem;color:var(--creme-2)}
details.camada .corpo p+p{margin-top:.5rem}

/* etiquetas e tons */
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.55rem}
.tag{font-family:var(--mono);font-size:.67rem;letter-spacing:.04em;padding:.14rem .42rem;
  border-radius:3px;background:var(--tinta-3);color:var(--creme-2);border:1px solid var(--linha)}
.tag.bom{color:var(--verde);border-color:#39503A}
.tag.mau{color:var(--vermelho);border-color:#5A2822}
.tag.ativo{color:var(--laranja);border-color:var(--laranja-fraco)}
.tag.barro{color:var(--barro);border-color:#5A4231}

/* linhas de dado — o registro "terminal" */
.dados{font-family:var(--mono);font-size:.78rem;color:var(--creme-2)}
.dados div{display:flex;gap:.6rem;padding:.16rem 0;border-bottom:1px solid rgba(51,43,35,.55)}
.dados div:last-child{border:none}
.dados dt,.dados .k{color:var(--creme-3);flex:none;min-width:8.5rem}
.dados .v{flex:1;color:var(--creme)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- HOJE ---------- */
.brief-topo{border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;
  margin-bottom:.75rem;background:var(--tinta-1)}
.brief-data{padding:.75rem .9rem;border-bottom:1px solid var(--linha);
  display:flex;justify-content:space-between;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.brief-data .dia{font-family:var(--serif);font-size:1.15rem}
.brief-data .lugar{font-family:var(--mono);font-size:.7rem;color:var(--creme-3);letter-spacing:.04em}
.brief-linha{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr))}
.brief-cel{padding:.6rem .9rem;border-right:1px solid var(--linha);border-top:1px solid var(--linha)}
.brief-cel:last-child{border-right:none}
.brief-cel .r{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--creme-3);display:block;margin-bottom:.15rem}
.brief-cel .v{font-size:.92rem;color:var(--creme)}
.brief-cel .v .gl{color:var(--laranja)}

/* hierarquia — a escada que organiza tudo */
.escada{display:flex;flex-direction:column;gap:0;margin:.2rem 0 .9rem;
  border-left:2px solid var(--linha);padding-left:.8rem}
.degrau{position:relative;padding:.38rem 0}
.degrau::before{content:"";position:absolute;left:-1.03rem;top:.85rem;width:.5rem;height:2px;
  background:var(--linha-forte)}
.degrau .r{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--creme-3)}
.degrau .v{font-size:.9rem}
.degrau.destaque::before{background:var(--laranja);width:.75rem;left:-1.03rem}
.degrau.destaque .r{color:var(--laranja)}

.rot-secao{font-family:var(--mono);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--creme-3);margin:1.4rem 0 .5rem;display:flex;align-items:center;gap:.55rem}
.rot-secao::after{content:"";flex:1;height:1px;background:var(--linha)}
.rot-secao:first-child{margin-top:0}

/* gatilho: o item da lista AGORA */
.gatilho{display:flex;gap:.65rem;align-items:flex-start;padding:.62rem .75rem;
  border:1px solid var(--linha);border-radius:var(--r-s);background:var(--tinta-1);margin-bottom:.4rem}
.gatilho.forte{border-color:var(--laranja-fraco);background:var(--tinta-2)}
.gatilho .asp{font-family:var(--mono);font-size:1.05rem;color:var(--laranja);flex:none;width:1.4rem;text-align:center}
.gatilho .txt{flex:1;min-width:0}
.gatilho .t1{font-size:.92rem}
.gatilho .t2{font-size:.78rem;color:var(--creme-3);margin-top:.12rem}
.gatilho .quando{font-family:var(--mono);font-size:.68rem;color:var(--barro);white-space:nowrap;flex:none}

/* ---------- cronologia real (item 5) ---------- */
.crono{position:relative;padding-left:1.6rem;margin-top:.4rem}
.crono::before{content:"";position:absolute;left:.42rem;top:.4rem;bottom:.4rem;width:1px;background:var(--linha)}
.crono-ev{position:relative;padding:.45rem 0 .55rem}
.crono-ev::before{content:"";position:absolute;left:-1.32rem;top:.85rem;width:9px;height:9px;
  border-radius:50%;background:var(--tinta);border:2px solid var(--linha-forte)}
.crono-ev[data-nivel=primário]::before{border-color:var(--laranja);background:var(--laranja)}
.crono-ev[data-nivel=secundário]::before{border-color:var(--barro)}
.crono-ev .quando{font-family:var(--mono);font-size:.68rem;color:var(--creme-3);letter-spacing:.05em}
.crono-ev .tit{font-size:.94rem;font-family:var(--serif)}
.crono-ev .det{font-size:.82rem;color:var(--creme-2)}
.crono-ev.agora{background:linear-gradient(90deg,rgba(217,106,43,.09),transparent);
  border-radius:var(--r-s);padding-left:.5rem;margin-left:-.5rem}

/* ---------- escalas qualitativas (perfil) ---------- */
.escala{margin:.5rem 0}
.escala-r{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68rem;
  color:var(--creme-3);margin-bottom:.2rem}
.escala-t{display:flex;gap:2px;height:6px}
.escala-t i{flex:1;background:var(--tinta-3);border-radius:1px}
.escala-t i.on{background:var(--barro)}
.escala-t i.on.forte{background:var(--laranja)}

/* ---------- tabela ---------- */
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -.9rem;padding:0 .9rem}
table.grade{border-collapse:collapse;font-family:var(--mono);font-size:.72rem;min-width:100%}
table.grade th,table.grade td{border:1px solid var(--linha);padding:.28rem .34rem;text-align:center;
  white-space:nowrap}
table.grade th{color:var(--creme-3);font-weight:400;font-size:.66rem;letter-spacing:.06em}
table.grade td.rot{text-align:left;color:var(--creme-2)}
table.grade td.vira{background:rgba(217,106,43,.1)}

/* ---------- busca (item 4) ---------- */
.busca-veu{position:fixed;inset:0;z-index:60;background:rgba(10,9,7,.82);
  backdrop-filter:blur(4px);display:none;padding:3.5rem .9rem}
.busca-veu.on{display:block}
.busca-cx{width:min(100%,34rem);margin:0 auto;background:var(--tinta-1);
  border:1px solid var(--linha-forte);border-radius:var(--r);box-shadow:var(--sombra-2);overflow:hidden}
.busca-cx input{width:100%;padding:.85rem 1rem;background:var(--tinta-2);border:none;
  border-bottom:1px solid var(--linha);color:var(--creme);font-family:var(--sans);font-size:1rem;outline:none}
.busca-res{max-height:60vh;overflow-y:auto}
.busca-res button{display:block;width:100%;text-align:left;padding:.6rem 1rem;
  border-bottom:1px solid var(--linha)}
.busca-res button:hover{background:var(--tinta-2)}
.busca-res .t{font-size:.92rem}
.busca-res .s{font-size:.75rem;color:var(--creme-3)}

/* ---------- menu ••• (item 21) ---------- */
.menu-pop{position:absolute;right:0;top:2.3rem;z-index:50;background:var(--tinta-2);
  border:1px solid var(--linha-forte);border-radius:var(--r-s);box-shadow:var(--sombra-2);
  min-width:12rem;padding:.25rem;display:none}
.menu-pop.on{display:block}
.menu-pop button{display:block;width:100%;text-align:left;padding:.45rem .6rem;border-radius:4px;
  font-size:.85rem;color:var(--creme-2)}
.menu-pop button:hover{background:var(--tinta-3);color:var(--creme)}
.menu-pop hr{border:none;border-top:1px solid var(--linha);margin:.25rem 0}
.bloco .mais{position:absolute;top:.5rem;right:.5rem;width:1.6rem;height:1.6rem;border-radius:4px;
  color:var(--creme-3);font-size:.9rem;line-height:1;display:grid;place-items:center}
.bloco .mais:hover{background:var(--tinta-3);color:var(--creme)}

/* ---------- edição ---------- */
.edit-area{width:100%;min-height:9rem;background:var(--tinta);border:1px solid var(--linha-forte);
  border-radius:var(--r-s);color:var(--creme);padding:.6rem;font-family:var(--sans);font-size:.9rem;
  line-height:1.5;resize:vertical}
.edit-bar{display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap}
.bt{padding:.32rem .7rem;border:1px solid var(--linha-forte);border-radius:var(--r-s);
  font-size:.78rem;color:var(--creme-2)}
.bt:hover{border-color:var(--barro);color:var(--creme)}
.bt.primario{background:var(--laranja-fraco);border-color:var(--laranja);color:#FFF3E8}
.texto img{max-width:100%;border-radius:var(--r-s);margin:.5rem 0;border:1px solid var(--linha)}
.texto p+p{margin-top:.55rem}

/* ---------- véu de leitura ---------- */
.veu{position:fixed;inset:0;z-index:70;background:rgba(10,9,7,.86);backdrop-filter:blur(5px);
  display:none;overflow-y:auto;padding:1rem .8rem 3rem}
.veu.on{display:block}
.veu-cx{width:min(100%,44rem);margin:0 auto;background:var(--tinta-1);border:1px solid var(--linha-forte);
  border-radius:var(--r);box-shadow:var(--sombra-2);padding:1.1rem}
.veu-fechar{position:sticky;top:0;float:right;font-size:1.2rem;color:var(--creme-3);
  width:2rem;height:2rem;border-radius:var(--r-s)}

/* ---------- diversos ---------- */
.aviso{border-left:2px solid var(--vermelho);background:rgba(168,56,46,.07);padding:.6rem .75rem;
  border-radius:0 var(--r-s) var(--r-s) 0;font-size:.83rem;color:var(--creme-2);margin:.6rem 0}
.nota{font-size:.8rem;color:var(--creme-3);font-style:italic}
.grade2{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.vazio{color:var(--creme-3);font-size:.87rem;padding:.8rem 0;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:.32rem;margin:.5rem 0 .8rem}
.chip{padding:.3rem .6rem;border:1px solid var(--linha);border-radius:99px;font-size:.78rem;
  color:var(--creme-2);background:var(--tinta-1)}
.chip[aria-pressed=true]{border-color:var(--laranja);color:var(--laranja);background:var(--tinta-2)}
.chip .gl{margin-right:.25rem}
#sync{font-family:var(--mono);font-size:.66rem;color:var(--creme-3);padding:.3rem .5rem}
#sync.ok{color:var(--verde)} #sync.erro{color:var(--vermelho)} #sync.indo{color:var(--laranja)}
.carregando{padding:2.5rem 0;text-align:center;color:var(--creme-3);font-family:var(--mono);font-size:.8rem}
@media (min-width:48rem){ body{font-size:15.5px} main{padding:1.4rem 1.2rem 4rem} }
@media (prefers-reduced-motion:no-preference){ .bloco{transition:border-color .15s,background .15s} }
</style>
</head>
<body>

<header class="topo">
  <div class="topo-in">
    <span class="marca">Lions <i>Daily</i></span>
    <div class="modos" role="tablist" id="modos">
      <button role="tab" data-modo="hoje" aria-selected="true">Hoje</button>
      <button role="tab" data-modo="mapa" aria-selected="false">Mapa</button>
    </div>
    <button class="icone" id="bt-busca" title="Buscar assunto" aria-label="Buscar assunto">⌕</button>
    <span style="position:relative">
      <button class="icone" id="bt-menu" title="Mais" aria-label="Mais opções">⋯</button>
      <div class="menu-pop" id="menu-geral"></div>
    </span>
  </div>
  <nav class="subnav" id="subnav" hidden><div class="subnav-in" id="subnav-in"></div></nav>
</header>

<main id="app"><div class="carregando">calculando o céu…</div></main>

<div class="busca-veu" id="busca-veu">
  <div class="busca-cx">
    <input id="busca-in" type="search" placeholder="dinheiro, casamento, saúde, carreira…"
           autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="busca-res" id="busca-res"></div>
  </div>
</div>

<div class="veu" id="veu"><div class="veu-cx">
  <button class="veu-fechar" id="veu-fechar" aria-label="Fechar">×</button>
  <div id="veu-corpo"></div>
</div></div>

<script src="vendor/astronomy.min.js"></script>
<script src="js/astro.js"></script>
<script src="js/tradition.js"></script>
<script src="js/corpus.js"></script>
<script src="js/chrono.js"></script>
<script src="js/perfil.js"></script>
<script src="js/ui.js"></script>
<script src="js/telas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
